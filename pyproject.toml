# Tooling config only - this repo is a set of scripts, not an installable package.

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = [
    "chat",
    "dataset",
    "metrics",
    "home",
    "listing",
    "predict",
    "prepare_dataset",
    "pricing",
    "tools",
]

[tool.ruff.lint.per-file-ignores]
# Obsolete from-scratch network: kept as-is on purpose.
"neural_network/*" = ["E731", "E741"]
# Test fixtures include long inline HTML strings.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "webscraping", "keras_neural_network", "webapp"]
