[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraping-fotocasa"
version = "0.1.0"
description = "Scrape Fotocasa listings and estimate Madrid flat prices (Master's thesis)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Runtime deps live in the per-area requirements.txt files (webscraping/,
# keras_neural_network/, webapp/, and the root one for the Streamlit deploy).
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools]
packages = ["webscraping", "keras_neural_network", "webapp"]
py-modules = ["prepare_dataset"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = ["webscraping", "keras_neural_network", "webapp", "prepare_dataset"]

[tool.ruff.lint.per-file-ignores]
# Obsolete from-scratch network: kept as-is on purpose.
"neural_network/*" = ["E731", "E741"]
# Test fixtures include long inline HTML strings.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
