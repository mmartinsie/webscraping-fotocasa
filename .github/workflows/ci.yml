name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling and light deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest beautifulsoup4 lxml numpy pandas scikit-learn selenium requests

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Compile every module
        run: python -m compileall -q webscraping neural_network keras_neural_network prepare_dataset.py

      - name: Tests
        run: pytest -q
