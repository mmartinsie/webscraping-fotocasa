<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madrid flat price estimator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --card: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --border: #d4d4d8;
    --accent: #2563eb;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --card: #27272a;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 460px; }
  .topbar { display: flex; justify-content: flex-end; margin-bottom: .4rem; }
  .lang {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: .15rem .5rem;
    font-size: .8rem;
    cursor: pointer;
    width: auto;
    margin: 0;
  }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  label { display: block; margin: .9rem 0 .3rem; font-weight: 600; font-size: .9rem; }
  form label:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type="number"], select {
    width: 100%;
    padding: .55rem .65rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  .check { display: flex; align-items: center; gap: .5rem; margin-top: .9rem; }
  .check label { margin: 0; }
  button[type="submit"] {
    margin-top: 1.3rem;
    width: 100%;
    padding: .7rem;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font: 600 1rem system-ui, sans-serif;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .result {
    margin-top: 1.3rem;
    padding: 1rem;
    border-radius: 10px;
    background: var(--bg);
    border: 1px dashed var(--border);
    text-align: center;
  }
  .price { font-size: 1.9rem; font-weight: 700; }
  .result small { color: var(--muted); display: block; margin-top: .3rem; }
  .about, footer {
    margin-top: 1.1rem;
    font-size: .8rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); }
  .err { color: #dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button type="button" class="lang" id="lang"></button>
  </div>

  <h1 data-i18n="title"></h1>
  <p class="lede" data-i18n-html="lede"></p>

  <div class="card">
    <form id="form">
      <label for="Distrito" data-i18n="lblDistrict"></label>
      <select id="Distrito"></select>

      <label for="Habitaciones" data-i18n="lblRooms"></label>
      <input type="number" id="Habitaciones" min="1" step="1" value="3" required>

      <label for="Aseos" data-i18n="lblBaths"></label>
      <input type="number" id="Aseos" min="1" step="1" value="2" required>

      <label for="Superficie" data-i18n-html="lblSize"></label>
      <input type="number" id="Superficie" min="15" step="1" value="90" required>

      <div class="check">
        <input type="checkbox" id="Parking">
        <label for="Parking" data-i18n="lblParking"></label>
      </div>

      <button type="submit" id="submit" disabled></button>
    </form>

    <div class="result" id="result" hidden>
      <div class="price" id="price">—</div>
      <small id="note"></small>
      <small id="nn"></small>
    </div>

    <p class="about" id="about"></p>
  </div>

  <footer data-i18n-html="footer"></footer>
</div>

<script>
const T = {
  en: {
    title: "Madrid flat price estimator",
    lede: "Estimate from the <strong>district's €/m²</strong> (~2024 prices) plus "
      + "the <strong>thesis neural network</strong> (~2020 data) as a reference. "
      + "Everything runs in your browser.",
    lblDistrict: "District",
    lblRooms: "Rooms",
    lblBaths: "Bathrooms",
    lblSize: 'Floor area <span class="hint">(m²)</span>',
    lblParking: "Has a parking space",
    btnCalc: "Estimate price",
    btnLoading: "Loading…",
    langOther: "ES",
    errTitle: "Could not load the data",
    errBody: 'Open this page from the published site (or serve it with '
      + '<code>python -m http.server</code>): <code>file://</code> cannot load the JSON.',
    about: (cfg, mae) => `Thesis reference: ${cfg} · mean error ≈ ${mae} · ~2020 data`,
    note: (d, m2, pk) => `${d} · ${m2} €/m²` + (pk ? " · +6% parking" : ""),
    nn: (p, sc) => `Thesis neural network (~2020 data): ${p} · ${sc} schools (by district)`,
    locale: "en-GB",
  },
  es: {
    title: "Tasador de pisos de Madrid",
    lede: "Estimación por <strong>€/m² del distrito</strong> (precios ~2024) más "
      + "la <strong>red neuronal del TFM</strong> (datos ~2020) como referencia. "
      + "Todo corre en tu navegador.",
    lblDistrict: "Distrito",
    lblRooms: "Habitaciones",
    lblBaths: "Aseos",
    lblSize: 'Superficie <span class="hint">(m²)</span>',
    lblParking: "Tiene plaza de parking",
    btnCalc: "Calcular precio",
    btnLoading: "Cargando…",
    langOther: "EN",
    errTitle: "No se pudieron cargar los datos",
    errBody: 'Abre esta página desde el sitio publicado (o sírvela con '
      + '<code>python -m http.server</code>): <code>file://</code> no permite cargar los JSON.',
    about: (cfg, mae) => `Referencia TFM: ${cfg} · error medio ≈ ${mae} · datos ~2020`,
    note: (d, m2, pk) => `${d} · ${m2} €/m²` + (pk ? " · +6% parking" : ""),
    nn: (p, sc) => `Red neuronal TFM (datos ~2020): ${p} · ${sc} colegios (por distrito)`,
    locale: "es-ES",
  },
};

const FOOTER = {
  en: 'Rough estimates: the per-district €/m² are ~2024-2025 figures from public '
    + 'indices and the network was trained on Fotocasa data (~2020). Not a '
    + 'professional appraisal. '
    + '<a href="https://github.com/mmartinsie/webscraping-fotocasa">Code on GitHub</a>.',
  es: 'Estimaciones aproximadas: los €/m² por distrito son cifras ~2024-2025 de '
    + 'índices públicos y la red se entrenó con datos de Fotocasa (~2020). No es '
    + 'una tasación profesional. '
    + '<a href="https://github.com/mmartinsie/webscraping-fotocasa">Código en GitHub</a>.',
};

const relu = (x) => (x > 0 ? x : 0);
const PARKING_PREMIUM = 1.06;
let M = null;   // neural model
let D = null;   // {district: eur/m2}
let lastResult = null;
let loadError = false;

let lang = localStorage.getItem("lang")
  || (navigator.language || "en").slice(0, 2).toLowerCase();
if (!T[lang]) lang = "en";

function fmt(n) {
  return Math.round(n).toLocaleString(T[lang].locale);
}
function eur(n) {
  return fmt(n) + " €";
}

function avg(key) {
  const v = Object.values(D).map((d) => d[key]);
  return v.reduce((a, b) => a + b, 0) / v.length;
}
function districtEurM2(district) {
  return (D && D[district] && D[district].eur_m2) || avg("eur_m2");
}
function districtSchools(district) {
  return Math.round((D && D[district] && D[district].colegios) ?? avg("colegios"));
}
function districtEstimate(district, superficie, parking) {
  const eurM2 = districtEurM2(district);
  return { price: eurM2 * superficie * (parking ? PARKING_PREMIUM : 1), eurM2 };
}

function predict(values) {
  let v = values.map((x, i) => (x - M.scaler.mean[i]) / M.scaler.scale[i]);
  for (const layer of M.layers) {
    const out = new Array(layer.b.length);
    for (let j = 0; j < layer.b.length; j++) {
      let s = layer.b[j];
      for (let i = 0; i < v.length; i++) s += v[i] * layer.W[i][j];
      out[j] = layer.activation === "relu" ? relu(s) : s;
    }
    v = out;
  }
  let price = v[0];
  if (M.band && M.band.low != null) price = Math.max(price, M.band.low);
  if (M.band && M.band.high != null) price = Math.min(price, M.band.high);
  return price;
}

function renderDistricts() {
  const select = document.getElementById("Distrito");
  if (!D) return;
  const current = select.value;
  select.innerHTML = "";
  Object.entries(D).sort((a, b) => b[1].eur_m2 - a[1].eur_m2).forEach(([name, d]) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} — ${fmt(d.eur_m2)} €/m²`;
    select.appendChild(opt);
  });
  if (current) select.value = current;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("lang").textContent = t.langOther;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t[el.dataset.i18n];
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = el.dataset.i18nHtml === "footer" ? FOOTER[lang] : t[el.dataset.i18nHtml];
  });

  const submit = document.getElementById("submit");
  const about = document.getElementById("about");
  if (loadError) {
    submit.textContent = t.errTitle;
    about.innerHTML = `<span class="err">${t.errBody}</span>`;
    return;
  }
  submit.textContent = M ? t.btnCalc : t.btnLoading;
  if (M) {
    const mae = M.meta.mae != null ? eur(M.meta.mae) : "n/a";
    about.textContent = t.about(M.meta.config || "neural network", mae);
  }
  renderDistricts();
  if (lastResult) {
    const { district, eurM2, parking, distPrice, nnPrice, schools } = lastResult;
    document.getElementById("price").textContent = eur(distPrice);
    document.getElementById("note").textContent = t.note(district, fmt(eurM2), parking);
    document.getElementById("nn").textContent = t.nn(eur(nnPrice), schools);
  }
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en";
  localStorage.setItem("lang", lang);
  render();
});

document.getElementById("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (!M || !D) return;
  const district = document.getElementById("Distrito").value;
  const superficie = parseFloat(document.getElementById("Superficie").value || "0");
  const parking = document.getElementById("Parking").checked ? 1 : 0;

  const { price: distPrice, eurM2 } = districtEstimate(district, superficie, parking);
  const schools = districtSchools(district);

  const numeric = M.numeric_features || M.features || [];
  const nnValues = numeric.map((name) => {
    if (name === "Colegios") return schools;
    const el = document.getElementById(name);
    if (!el) return 0;
    return el.type === "checkbox" ? (el.checked ? 1 : 0) : parseFloat(el.value || "0");
  });
  for (const cat of M.district_categories || []) nnValues.push(cat === district ? 1 : 0);
  const nnPrice = predict(nnValues);

  lastResult = { district, eurM2, parking, distPrice, nnPrice, schools };
  document.getElementById("result").hidden = false;
  render();
});

async function init() {
  try {
    [M, D] = await Promise.all([
      fetch("model.json", { cache: "no-cache" }).then((r) => r.json()),
      fetch("districts.json", { cache: "no-cache" }).then((r) => r.json()),
    ]);
  } catch (e) {
    loadError = true;
    render();
    return;
  }
  document.getElementById("submit").disabled = false;

  const medians = M.feature_medians || {};
  for (const name of M.numeric_features || M.features || []) {
    const el = document.getElementById(name);
    if (el && medians[name] != null) {
      if (el.type === "checkbox") el.checked = Math.round(medians[name]) === 1;
      else el.value = Math.round(medians[name]);
    }
  }
  render();
}

render();
init();
</script>
</body>
</html>
