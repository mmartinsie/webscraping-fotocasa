<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madrid flat price estimator</title>
<meta name="description" content="Estimate the sale price of a flat in Madrid — runs entirely in your browser.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --fg: #14161a;
    --muted: #656c7a;
    --border: #e0e4ec;
    --accent: #2f6bff;
    --accent-2: #6a4bff;
    --accent-weak: #e9effe;
    --accent-fg: #ffffff;
    --good: #12a150;
    --danger: #e5484d;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow-lg: 0 1px 3px rgba(16,24,40,.05), 0 20px 48px -20px rgba(16,24,40,.22);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e12;
      --surface: #16191f;
      --surface-2: #1d212a;
      --fg: #eceef1;
      --muted: #949cab;
      --border: #282d38;
      --accent: #5b8bff;
      --accent-2: #9a86ff;
      --accent-weak: #1a2333;
      --accent-fg: #0c0e12;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-lg: 0 1px 3px rgba(0,0,0,.5), 0 24px 56px -22px rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(1rem, 4vw, 3.5rem) 1rem 3rem;
    background:
      radial-gradient(900px 400px at 15% -8%, color-mix(in srgb, var(--accent) 14%, transparent), transparent),
      radial-gradient(700px 340px at 100% 0%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 940px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem;
  }
  .brand { display: flex; align-items: center; gap: .7rem; }
  .brand .mark {
    width: 40px; height: 40px; flex: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: grid; place-items: center; font-size: 1.2rem;
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  h1 { font-size: 1.2rem; font-weight: 680; margin: 0; letter-spacing: -.015em; }
  .subtitle { color: var(--muted); font-size: .82rem; margin: .12rem 0 0; }
  .lang {
    flex: none; background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; padding: .4rem .85rem;
    font: inherit; font-size: .76rem; font-weight: 700; letter-spacing: .03em; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: color .12s, border-color .12s;
  }
  .lang:hover { color: var(--fg); border-color: var(--muted); }

  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: clamp(1.15rem, 3.5vw, 1.6rem);
  }
  .card > h2 {
    margin: 0 0 1.1rem; font-size: .74rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  form { display: grid; gap: 1rem; }
  .field { display: grid; gap: .4rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  label { font-weight: 600; font-size: .8rem; color: var(--fg); }
  .hint { font-weight: 400; color: var(--muted); }
  input[type="number"], select {
    width: 100%; padding: .62rem .72rem;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); color: var(--fg); font: inherit;
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  input[type="number"]:focus, select:focus {
    outline: none; border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .check {
    display: flex; align-items: center; gap: .6rem;
    padding: .6rem .72rem; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); cursor: pointer; user-select: none;
  }
  .check input { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
  .check span { font-weight: 600; font-size: .8rem; }

  .context {
    display: flex; flex-wrap: wrap; gap: .4rem; margin-top: -.2rem;
  }
  .chip {
    font-size: .74rem; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: .28rem .6rem;
  }
  .chip b { color: var(--fg); font-weight: 650; }

  button[type="submit"] {
    margin-top: .1rem; width: 100%; padding: .85rem; border: 0; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font: inherit; font-size: .95rem; font-weight: 680; cursor: pointer;
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 75%, transparent);
    transition: filter .12s, transform .06s;
  }
  button[type="submit"]:hover:not(:disabled) { filter: brightness(1.06); }
  button[type="submit"]:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; box-shadow: none; }

  /* Result panel: always visible, with an empty state before the first run. */
  #panel { display: flex; flex-direction: column; min-height: 100%; }
  .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); padding: 2rem 1rem; gap: .5rem;
  }
  .empty .ico {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    background: var(--accent-weak); color: var(--accent); font-size: 1.4rem;
  }
  .empty p { margin: 0; font-size: .85rem; max-width: 24ch; }

  @media (prefers-reduced-motion: no-preference) {
    .result:not([hidden]) { animation: rise .3s ease both; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .eyebrow { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .price {
    font-size: clamp(2.1rem, 7vw, 2.7rem); font-weight: 750; letter-spacing: -.025em;
    margin: .2rem 0 .15rem; font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .range { color: var(--muted); font-size: .86rem; }
  .breakdown { color: var(--muted); font-size: .82rem; margin-top: .6rem; }

  .bars { margin-top: 1.15rem; display: grid; gap: .7rem; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: .6rem; font-size: .78rem; }
  .bar-row .name { color: var(--muted); }
  .bar-track { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .45s cubic-bezier(.2,.7,.2,1); }
  .bar-row.ref .bar-fill { background: var(--muted); }
  .bar-row .val { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }

  .note {
    margin-top: 1.15rem; padding-top: 1rem; border-top: 1px solid var(--border);
    font-size: .76rem; color: var(--muted); line-height: 1.5;
  }
  footer { margin-top: 1.5rem; text-align: center; font-size: .76rem; color: var(--muted); }
  footer a, .note a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .err { color: var(--danger); }
  code { background: var(--surface-2); padding: .06rem .32rem; border-radius: 5px; font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">🏙</div>
      <div>
        <h1 data-i18n="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <button type="button" class="lang" id="lang"></button>
  </header>

  <div class="layout">
    <div class="card">
      <h2 data-i18n="formHeading"></h2>
      <form id="form">
        <div class="field">
          <label for="Distrito" data-i18n="lblDistrict"></label>
          <select id="Distrito"></select>
        </div>

        <div class="context" id="context" hidden>
          <span class="chip" id="chipEurM2"></span>
          <span class="chip" id="chipSchools"></span>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="Habitaciones" data-i18n="lblRooms"></label>
            <input type="number" id="Habitaciones" min="1" step="1" value="3" required>
          </div>
          <div class="field">
            <label for="Aseos" data-i18n="lblBaths"></label>
            <input type="number" id="Aseos" min="1" step="1" value="2" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="Superficie" data-i18n-html="lblSize"></label>
            <input type="number" id="Superficie" min="15" step="1" value="90" required>
          </div>
          <label class="check" style="align-self:end">
            <input type="checkbox" id="Parking">
            <span data-i18n="lblParking"></span>
          </label>
        </div>

        <button type="submit" id="submit" disabled></button>
      </form>
    </div>

    <div class="card" id="panel">
      <h2 data-i18n="resultHeading"></h2>

      <div class="empty" id="emptyState">
        <div class="ico" aria-hidden="true">📊</div>
        <p data-i18n="emptyBody"></p>
      </div>

      <div class="result" id="result" hidden>
        <div class="eyebrow" data-i18n="resultLabel"></div>
        <div class="price" id="price">—</div>
        <div class="range" id="range"></div>
        <div class="breakdown" id="breakdown"></div>

        <div class="bars">
          <div class="bar-row">
            <span class="name" data-i18n="barEstimate"></span>
            <span class="bar-track"><span class="bar-fill" id="barA"></span></span>
            <span class="val" id="valA"></span>
          </div>
          <div class="bar-row ref">
            <span class="name" data-i18n="barNN"></span>
            <span class="bar-track"><span class="bar-fill" id="barB"></span></span>
            <span class="val" id="valB"></span>
          </div>
        </div>
        <div class="note" id="nnTag"></div>
      </div>

      <p class="note" id="about"></p>
    </div>
  </div>

  <footer data-i18n-html="footer"></footer>
</div>

<script>
const RANGE_PCT = 0.15;
const T = {
  en: {
    title: "Madrid flat price estimator",
    subtitle: "Runs entirely in your browser",
    formHeading: "The flat",
    resultHeading: "Estimate",
    lblDistrict: "District",
    lblRooms: "Rooms",
    lblBaths: "Bathrooms",
    lblSize: 'Floor area <span class="hint">(m²)</span>',
    lblParking: "Parking",
    btnCalc: "Estimate price",
    btnLoading: "Loading…",
    langOther: "ES",
    chipEurM2: (e) => `${e} €/m² · 2024`,
    chipSchools: (n) => `${n} schools`,
    emptyBody: "Fill in the details and get an estimate with a market vs. neural-net comparison.",
    resultLabel: "Estimated price",
    range: (lo, hi) => `likely range ${lo} – ${hi}`,
    breakdown: (m2, e, pk) => `${m2} m² × ${e} €/m²` + (pk ? " · +6% parking" : ""),
    barEstimate: "€/m² · 2024",
    barNN: "Neural net",
    nnTag: (sc, cfg) => `Reference: thesis network (${cfg}), ~2020 data · ${sc} schools by district.`,
    errTitle: "Could not load the data",
    errBody: 'Open this page from the published site (or serve it with '
      + '<code>python -m http.server</code>): <code>file://</code> cannot load the JSON.',
    about: (mae) => `Rough orientation only, not an appraisal. Thesis model mean error ≈ ${mae}.`,
    locale: "en-GB",
  },
  es: {
    title: "Tasador de pisos de Madrid",
    subtitle: "Todo corre en tu navegador",
    formHeading: "El piso",
    resultHeading: "Estimación",
    lblDistrict: "Distrito",
    lblRooms: "Habitaciones",
    lblBaths: "Aseos",
    lblSize: 'Superficie <span class="hint">(m²)</span>',
    lblParking: "Parking",
    btnCalc: "Calcular precio",
    btnLoading: "Cargando…",
    langOther: "EN",
    chipEurM2: (e) => `${e} €/m² · 2024`,
    chipSchools: (n) => `${n} colegios`,
    emptyBody: "Rellena los datos y obtén una estimación con comparación mercado vs. red neuronal.",
    resultLabel: "Precio estimado",
    range: (lo, hi) => `rango probable ${lo} – ${hi}`,
    breakdown: (m2, e, pk) => `${m2} m² × ${e} €/m²` + (pk ? " · +6% parking" : ""),
    barEstimate: "€/m² · 2024",
    barNN: "Red neuronal",
    nnTag: (sc, cfg) => `Referencia: red del TFM (${cfg}), datos ~2020 · ${sc} colegios por distrito.`,
    errTitle: "No se pudieron cargar los datos",
    errBody: 'Abre esta página desde el sitio publicado (o sírvela con '
      + '<code>python -m http.server</code>): <code>file://</code> no permite cargar los JSON.',
    about: (mae) => `Solo orientación aproximada, no es una tasación. Error medio del modelo TFM ≈ ${mae}.`,
    locale: "es-ES",
  },
};
const FOOTER = {
  en: 'Per-district €/m² are ~2024-2025 public-index figures; the network was trained on '
    + 'Fotocasa data (~2020). '
    + '<a href="https://github.com/mmartinsie/webscraping-fotocasa">Source on GitHub</a>.',
  es: 'Los €/m² por distrito son cifras de índices públicos ~2024-2025; la red se entrenó con '
    + 'datos de Fotocasa (~2020). '
    + '<a href="https://github.com/mmartinsie/webscraping-fotocasa">Código en GitHub</a>.',
};

const relu = (x) => (x > 0 ? x : 0);
const PARKING_PREMIUM = 1.06;
let M = null, D = null, lastResult = null, loadError = false;

let lang = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
if (!T[lang]) lang = "en";

const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString(T[lang].locale);
const eur = (n) => fmt(n) + " €";

function avg(key) {
  const v = Object.values(D).map((d) => d[key]);
  return v.reduce((a, b) => a + b, 0) / v.length;
}
const districtEurM2 = (d) => (D && D[d] && D[d].eur_m2) || avg("eur_m2");
const districtSchools = (d) => Math.round((D && D[d] && D[d].colegios) ?? avg("colegios"));

function predict(values) {
  let v = values.map((x, i) => (x - M.scaler.mean[i]) / M.scaler.scale[i]);
  for (const layer of M.layers) {
    const out = new Array(layer.b.length);
    for (let j = 0; j < layer.b.length; j++) {
      let s = layer.b[j];
      for (let i = 0; i < v.length; i++) s += v[i] * layer.W[i][j];
      out[j] = layer.activation === "relu" ? relu(s) : s;
    }
    v = out;
  }
  let price = v[0];
  if (M.band && M.band.low != null) price = Math.max(price, M.band.low);
  if (M.band && M.band.high != null) price = Math.min(price, M.band.high);
  return price;
}

function renderDistricts() {
  const select = $("Distrito");
  if (!D) return;
  const current = select.value;
  select.innerHTML = "";
  Object.entries(D).sort((a, b) => b[1].eur_m2 - a[1].eur_m2).forEach(([name, d]) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} — ${fmt(d.eur_m2)} €/m²`;
    select.appendChild(opt);
  });
  if (current) select.value = current;
}

function updateContext() {
  const t = T[lang];
  const district = $("Distrito").value;
  if (!D || !district) { $("context").hidden = true; return; }
  $("chipEurM2").innerHTML = t.chipEurM2(`<b>${fmt(districtEurM2(district))}</b>`);
  $("chipSchools").innerHTML = t.chipSchools(`<b>${districtSchools(district)}</b>`);
  $("context").hidden = false;
}

function compute() {
  if (!M || !D) return;
  const district = $("Distrito").value;
  const superficie = parseFloat($("Superficie").value || "0");
  const parking = $("Parking").checked ? 1 : 0;
  const eurM2 = districtEurM2(district);
  const distPrice = eurM2 * superficie * (parking ? PARKING_PREMIUM : 1);
  const schools = districtSchools(district);

  const numeric = M.numeric_features || M.features || [];
  const values = numeric.map((name) => {
    if (name === "Colegios") return schools;
    const el = $(name);
    if (!el) return 0;
    return el.type === "checkbox" ? (el.checked ? 1 : 0) : parseFloat(el.value || "0");
  });
  for (const cat of M.district_categories || []) values.push(cat === district ? 1 : 0);

  lastResult = { eurM2, superficie, parking, schools, distPrice, nnPrice: predict(values) };
  $("emptyState").hidden = true;
  $("result").hidden = false;
  paint();
}

function paint() {
  if (!lastResult) return;
  const t = T[lang];
  const { eurM2, superficie, parking, schools, distPrice, nnPrice } = lastResult;
  $("price").textContent = eur(distPrice);
  $("range").textContent = t.range(eur(distPrice * (1 - RANGE_PCT)), eur(distPrice * (1 + RANGE_PCT)));
  $("breakdown").textContent = t.breakdown(fmt(superficie), fmt(eurM2), parking);
  const max = Math.max(distPrice, nnPrice, 1);
  $("barA").style.width = (100 * distPrice / max) + "%";
  $("barB").style.width = (100 * nnPrice / max) + "%";
  $("valA").textContent = eur(distPrice);
  $("valB").textContent = eur(nnPrice);
  $("nnTag").textContent = t.nnTag(schools, (M.meta && M.meta.config) || "MLP");
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $("lang").textContent = t.langOther;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = el.dataset.i18nHtml === "footer" ? FOOTER[lang] : t[el.dataset.i18nHtml];
  });
  const submit = $("submit");
  const about = $("about");
  if (loadError) {
    submit.textContent = t.errTitle;
    about.innerHTML = `<span class="err">${t.errBody}</span>`;
    return;
  }
  submit.textContent = M ? t.btnCalc : t.btnLoading;
  if (M) about.textContent = t.about(M.meta && M.meta.mae != null ? eur(M.meta.mae) : "n/a");
  renderDistricts();
  updateContext();
  paint();
}

$("lang").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
});
$("form").addEventListener("submit", (ev) => { ev.preventDefault(); compute(); });
$("form").addEventListener("input", () => { updateContext(); if (lastResult) compute(); });

async function init() {
  try {
    [M, D] = await Promise.all([
      fetch("model.json", { cache: "no-cache" }).then((r) => r.json()),
      fetch("districts.json", { cache: "no-cache" }).then((r) => r.json()),
    ]);
  } catch (e) {
    loadError = true;
    render();
    return;
  }
  $("submit").disabled = false;
  const medians = M.feature_medians || {};
  for (const name of M.numeric_features || M.features || []) {
    const el = $(name);
    if (el && medians[name] != null) {
      if (el.type === "checkbox") el.checked = Math.round(medians[name]) === 1;
      else el.value = Math.round(medians[name]);
    }
  }
  render();
}

render();
init();
</script>
</body>
</html>
